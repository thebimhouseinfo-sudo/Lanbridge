name: Windows and macOS checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Check embedded UI JavaScript syntax
        run: node tools/check-ui-js.cjs
      - name: Race detector (macOS)
        if: runner.os == 'macOS'
        run: go test -race -count=1 ./...
      - name: Build Windows GUI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          go build -ldflags="-s -w -H windowsgui" -o dist/windows/bridge.exe ./cmd/bridge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item scripts/install.ps1 dist/windows/
      - name: Build macOS app
        if: runner.os == 'macOS'
        run: make dist-mac
      - name: Check macOS installer syntax
        if: runner.os == 'macOS'
        run: sh -n scripts/install.sh
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/mac dist/testbridge-macos-arm64.zip
      - name: Upload Windows test package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: testbridge-windows-amd64
          path: dist/windows/
          if-no-files-found: error
      - name: Upload macOS test package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: testbridge-macos-arm64
          path: dist/testbridge-macos-arm64.zip
          if-no-files-found: error

  publish-test-packages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: testbridge-windows-amd64
          path: windows
      - uses: actions/download-artifact@v4
        with:
          name: testbridge-macos-arm64
          path: macos
      - name: Create test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view test-2026-11-03 >/dev/null 2>&1; then
            echo 'Test release already exists; leaving it unchanged.'
            exit 0
          fi
          (cd windows && zip -q ../testbridge-windows-amd64.zip bridge.exe install.ps1)
          gh release create test-2026-11-03 testbridge-windows-amd64.zip macos/testbridge-macos-arm64.zip --target "$GITHUB_SHA" --prerelease --title "Test build 2026-11-03" --notes "Test build; two-machine acceptance is pending."
